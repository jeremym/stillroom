id: read_folder
version: 1
name: Read the files
summary: Read every PDF, Word, Markdown, or text file in a folder and pull out what each says about a focus, with quotes and page numbers; kept between runs so unchanged files are not read again.
why: Each file is read and an AI step pulls out what it says about your focus, with exact quotes and page numbers. What it found is remembered, so unchanged files are not read again next time.
tags: [documents, findings]
inputs:
  folder: { type: directory, label: Your documents, description: "A folder of .pdf, .docx, .md, or .txt files. Subfolders are read too." }
  focus: { type: text, label: What do you need to know?, description: A question or a sentence about what matters. }
modelSlots:
  reader: { requires: [text, structured_output], preference: accuracy, description: Reads each file and pulls out what it says about the focus. }
permissions:
  filesystem: { read: [input] }
keep: { refresh: when_sources_change }
steps:
  - id: read_list
    kind: tool
    name: List the files
    tool: fs.list
    inputs: { path: "${inputs.folder}", extensions: [pdf, docx, md, markdown, txt], recursive: true }
  - id: read_files
    kind: map
    name: Read each file
    over: "${steps.read_list.output.entries}"
    as: file
    concurrency: 2
    steps:
      - { id: text, kind: tool, name: Read the file, tool: doc.text, inputs: { path: "${file.path}" } }
      - id: findings
        kind: model
        name: Pull out what it says
        slot: reader
        prompt: prompts/read_folder_findings.md
        inputs: { focus: "${inputs.focus}", source: "${file.path}", text: "${steps.text.output.text}" }
        outputSchema: schemas/read_folder_findings.json
        params: { think: false, temperature: 0.1, contextLength: 32768 }
returns:
  - "${steps.read_files.output}: one entry per file with file.path, text.kind, text.chars, text.note, and findings { summary, relevance, findings: [{ claim, quote, where }] }"
